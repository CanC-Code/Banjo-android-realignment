name: Static Build File Setup & Commit

on:
  workflow_dispatch:

jobs:
  setup-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🖼️ Generate Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ ! -f "icon_master.png" ]; then
            convert -size 512x512 xc:blue icon_master.png
          fi
          python3 scripts/generate_icons.py icon_master.png

      - name: 🧹 Pre-Patching (Sanitizer)
        run: python3 scripts/sanitize_codebase.py .

      - name: 🛡️ Apply Surgical Linker Patch
        run: |
          export PATH=$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          python3 scripts/patch_linker_wraps.py

      - name: 🗺️ Generate Asset Manifests
        run: |
          pip3 install pyyaml
          python3 scripts/generate_manifest.py

      - name: OTR corrections
        run: |
          pip3 install pyyaml
          python3 scripts/otr_start_corrections.py
          python3 scripts/fix_bka_startup.py

      - name: 🚀 Commit and Push to static-build Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and switch to the static-build branch (overwriting if it already exists)
          git checkout --orphan static-build
          
          git add -A
          git commit -m "chore: automated static build file setup and OTR preparation [skip ci]"
          
          # Force push the static-build branch to remote
          git push origin static-build --force
