name: Patch OTR Builder Endianness and Commit

on:
  workflow_dispatch:

jobs:
  patch-otr-builder:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Branch
        uses: actions/checkout@v4
        with:
          ref: static-build
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Patch otr_builder.cpp
        run: |
          TARGET_FILE="Android/app/src/main/cpp/ultra/otr_builder.cpp"

          python3 - << 'EOF'
          import re

          file_path = "Android/app/src/main/cpp/ultra/otr_builder.cpp"

          with open(file_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Replacement functions for byteswap_v64 and byteswap_n64
          new_byteswap_code = """// ---------------------------------------------------------------------------
          // ROM byte order normalization
          // ---------------------------------------------------------------------------

          // v64 format:
          // Byte pair swap (BADC -> ABCD)
          static void byteswap_v64(uint8_t* data, size_t size) {
              if (!data) return;
              uint16_t* d16 = reinterpret_cast<uint16_t*>(data);
              size_t count = size / 2;
              for (size_t i = 0; i < count; ++i) {
                  uint16_t val = d16[i];
                  d16[i] = static_cast<uint16_t>((val >> 8) | (val << 8));
              }
          }

          // n64 format (Big Endian):
          // 32-bit word swap (DCBA -> ABCD)
          static void byteswap_n64(uint8_t* data, size_t size) {
              if (!data) return;
              uint32_t* d32 = reinterpret_cast<uint32_t*>(data);
              size_t count = size / 4;
              for (size_t i = 0; i < count; ++i) {
                  uint32_t val = d32[i];
                  d32[i] = ((val & 0xFF000000u) >> 24) |
                           ((val & 0x00FF0000u) >>  8) |
                           ((val & 0x0000FF00u) <<  8) |
                           ((val & 0x000000FFu) << 24);
              }
          }"""

          # Match existing byteswap_v64 through byteswap_n64 implementations
          pattern = r'//\s*-*\n//\s*ROM byte order normalization\n//\s*-*[\s\S]*?static void byteswap_n64\(uint8_t\* data, size_t size\) \{[\s\S]*?\n\}'

          if re.search(pattern, content):
              updated_content = re.sub(pattern, new_byteswap_code, content, count=1)
          else:
              # Fallback: Replace standalone functions directly if header comment pattern differs
              v64_pattern = r'static void byteswap_v64\(uint8_t\* data, size_t size\) \{[\s\S]*?\n\}'
              n64_pattern = r'static void byteswap_n64\(uint8_t\* data, size_t size\) \{[\s\S]*?\n\}'
              
              updated_content = re.sub(v64_pattern, '', content)
              updated_content = re.sub(n64_pattern, new_byteswap_code, updated_content)

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(updated_content)

          print(f"Successfully patched {file_path}")
          EOF

      - name: 🚀 Commit and Push Files to Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add Android/app/src/main/cpp/ultra/otr_builder.cpp
          git status

          git commit -m "fix(otr): update n64 and v64 byteswapping routines in otr_builder"
          git push origin static-build
