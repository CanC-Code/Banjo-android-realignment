name: Patch OTR Builder Endianness and Commit

on:
  workflow_dispatch:

jobs:
  patch-otr-builder:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Branch
        uses: actions/checkout@v4
        with:
          ref: static-build
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Patch otr_builder.cpp
        run: |
          TARGET_FILE="Android/app/src/main/cpp/ultra/otr_builder.cpp"

          python3 - << 'EOF'
          import re

          file_path = "Android/app/src/main/cpp/ultra/otr_builder.cpp"

          with open(file_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Target fixed functions
          new_byteswap_code = """// ---------------------------------------------------------------------------
          // ROM byte order normalization
          // ---------------------------------------------------------------------------

          // v64 format:
          // Byte pair swap (BADC -> ABCD)
          static void byteswap_v64(uint8_t* data, size_t size) {
              if (!data) return;
              uint16_t* d16 = reinterpret_cast<uint16_t*>(data);
              size_t count = size / 2;
              for (size_t i = 0; i < count; ++i) {
                  uint16_t val = d16[i];
                  d16[i] = static_cast<uint16_t>((val >> 8) | (val << 8));
              }
          }

          // n64 format (Big Endian):
          // 32-bit word swap (DCBA -> ABCD)
          static void byteswap_n64(uint8_t* data, size_t size) {
              if (!data) return;
              uint32_t* d32 = reinterpret_cast<uint32_t*>(data);
              size_t count = size / 4;
              for (size_t i = 0; i < count; ++i) {
                  uint32_t val = d32[i];
                  d32[i] = ((val & 0xFF000000u) >> 24) |
                           ((val & 0x00FF0000u) >>  8) |
                           ((val & 0x0000FF00u) <<  8) |
                           ((val & 0x000000FFu) << 24);
              }
          }"""

          # Regex to match byteswap_v64 and byteswap_n64 function bodies regardless of surrounding comments
          func_pattern = r'static void byteswap_v64\([^)]*\)\s*\{[\s\S]*?\n\}\s*static void byteswap_n64\([^)]*\)\s*\{[\s\S]*?\n\}'

          if re.search(func_pattern, content):
              content = re.sub(func_pattern, new_byteswap_code, content, count=1)
              print("Successfully matched and replaced existing byteswap routines.")
          else:
              # Secondary fallback matching functions individually
              v64_pat = r'static void byteswap_v64\([^)]*\)\s*\{[\s\S]*?\n\}'
              n64_pat = r'static void byteswap_n64\([^)]*\)\s*\{[\s\S]*?\n\}'
              content = re.sub(v64_pat, '', content)
              content = re.sub(n64_pat, new_byteswap_code, content)
              print("Replaced functions via fallback individual match.")

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: 🚀 Commit and Push Files to Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add Android/app/src/main/cpp/ultra/otr_builder.cpp
          git status

          # Only commit if there are actual changes staged
          if git diff-index --quiet HEAD --; then
            echo "No changes detected to commit."
          else
            git commit -m "fix(otr): update n64 and v64 byteswapping routines in otr_builder"
            git push origin static-build
          fi
